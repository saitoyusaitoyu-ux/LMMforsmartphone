<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>WebAR QR Vertical Model</title>
    
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- MindAR for A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* 背景を透明（transparent）にし、カメラ映像が透過して見えるようにする */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: transparent;
      }
      /* MindARが自動生成するカメラ映像（video）を最背面に配置 */
      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
      }
    </style>
  </head>
  <body>
    
    <!-- alpha: true を指定して3D空間の背景を透明化 -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: true">
      
      <a-assets>
        <a-asset-item id="modelFile" src="./model.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- QRコード（ターゲット0番）認識時に出現するコンテナ -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- rotation="90 0 0" で机上のQRコードに対して垂直に直立させる -->
        <a-entity 
          gltf-model="#modelFile" 
          position="0 0 0" 
          rotation="90 0 0" 
          scale="0.6 0.6 0.6">
        </a-entity>
      </a-entity>

      <a-light type="ambient" color="#ffffff" intensity="1.3"></a-light>
      <a-light type="directional" position="1 2 1" intensity="0.9"></a-light>

    </a-scene>

  </body>
</html>
